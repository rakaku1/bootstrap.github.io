<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Bootstrap Breakpoints</title>

  <!-- Bootstrap 5.3 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #f1f3f5;
    }

    .header {
      background-color: #0d6efd;
      color: white;
      min-height: 100px;
    }

    .kiri {
      background-color: #198754;
      color: white;
      min-height: 200px;
    }

    .panel-a {
      background-color: #ffc107;
      color: #212529;
      min-height: 200px;
    }

    .panel-b {
      background-color: #dc3545;
      color: white;
      min-height: 200px;
    }

    .header,
    .kiri,
    .panel-a,
    .panel-b {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      font-size: 20px;
      padding: 20px;
    }
  </style>
</head>

<body class="p-3 p-md-5">

  <div class="container bg-white p-4 rounded shadow-sm">

    <h2 class="text-center mb-4">
      Demo Layout Responsif
    </h2>

    <!-- Indikator breakpoint -->
    <div class="text-center mb-4">
      <span class="badge bg-danger d-block d-sm-none">
        XS - Extra Small
      </span>

      <span class="badge bg-warning text-dark d-none d-sm-block d-md-none">
        SM - Small
      </span>

      <span class="badge bg-info text-dark d-none d-md-block d-lg-none">
        MD - Medium
      </span>

      <span class="badge bg-primary d-none d-lg-block d-xl-none">
        LG - Large
      </span>

      <span class="badge bg-success d-none d-xl-block d-xxl-none">
        XL - Extra Large
      </span>

      <span class="badge bg-dark d-none d-xxl-block">
        XXL - Extra Extra Large
      </span>
    </div>

    <!-- HEADER -->
    <div class="row mb-3">
      <div class="col-12">
        <div class="header">
          Header    
        </div>
      </div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="row g-3">

      <!-- KIRI -->
      <div class="col-12 col-md-6">
        <div class="kiri h-100">
          Kiri
        </div>
      </div>

      <!-- PANEL A -->
      <div class="col-6 col-md-3">
        <div class="panel-a h-100">
          A
        </div>
      </div>

      <!-- PANEL B -->
      <div class="col-6 col-md-3">
        <div class="panel-b h-100">
          B
        </div>
      </div>

    </div>

    <p class="text-muted text-center mt-4 mb-0">
      Coba kecilkan atau besarkan jendela browser
      untuk melihat perubahan layout.
    </p>

  </div>

</body>
</html>
